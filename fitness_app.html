 const p=state.profile,w=n(p.currentWeight),h=n(p.height),age=n(p.age),hm=h/100,bmi=hm?w/(hm*hm):0;
 const bmr=p.sex==='female'?10*w+6.25*h-5*age-161:10*w+6.25*h-5*age+5; const tdee=bmr*(activity[p.activity]||1.55);
 let cal=tdee;if(p.goal==='fatloss'||p.goal==='recomp')cal-=400; if(p.goal==='leanbulk')cal+=250; if(p.goal==='muscle'||p.goal==='strength')cal+=350;
 const proteinWeight=p.proteinByTarget?n(p.goalWeight)||w:w; const protein=Math.round(proteinWeight*1.8); const fat=Math.round(w*.8);
 const carbs=Math.max(80,Math.round((cal-protein*4-fat*9)/4)); return {bmi,bmr,tdee,cal,protein,fat,carbs};
}
function parseRange(r){let m=String(r).match(/(\d+)\D+(\d+)/); if(m)return {min:n(m[1]),max:n(m[2])}; m=String(r).match(/(\d+)/); return {min:n(m&&m[1]||0),max:n(m&&m[1]||0)}}
function setCount(s){let m=String(s).match(/(\d+)\D+(\d+)/);return m?n(m[2]):n(String(s).match(/\d+/)?.[0]||0)}
function volumeFromSets(sets){return (sets||[]).reduce((a,s)=>a+n(s.weight)*n(s.reps),0)}
function e1rm(w,r){return n(w)*(1+n(r)/30)}
function weekNum(){const st=new Date(state.settings.startDate||today()),now=new Date();return clamp(Math.floor((now-st)/604800000)+1,1,activeProgram().durationWeeks||8)}
function weekStart(d=new Date()){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function inThisWeek(date){return new Date(date)>=weekStart()}
function roundWeight(w,equipment){
 const eq=(equipment||'').toLowerCase(); let inc=2.5; if(eq.includes('dumbbell'))inc=2; if(eq.includes('machine')||eq.includes('cable'))inc=2.5; return Math.round(w/inc)*inc;
}
function progressionFor(log){
 const ex=exById(log.exerciseId), range=parseRange(log.targetReps||ex.reps), sets=log.sets||[], planned=n(log.targetSets)||sets.length, goodTech=sets.every(s=>s.technique==='Good'||s.technique==='جيد'), pain=sets.some(s=>s.pain&&s.pain!=='No pain');
 const allDone=sets.length>=planned, allTop=sets.length&&sets.every(s=>n(s.reps)>=range.max), below=sets.some(s=>n(s.reps)<range.min), avgRir=sets.reduce((a,s)=>a+n(s.rir),0)/(sets.length||1), badTech=sets.some(s=>s.technique==='Bad'||s.technique==='سيئ'), lowRir=sets.filter(s=>n(s.rir)<=1).length>=Math.ceil(sets.length/2);
 let decision='Maintain weight', ar='ثبّت الوزن', reason='Reps are within range. Keep weight and build reps first.', pct=.025;
 if(badTech){decision='Improve technique';ar='ركّز على التكنيك';reason='Technique was marked bad. Do not increase weight.'}
 else if(pain){decision='Reduce/Substitute';ar='قلل الوزن أو بدّل التمرين';reason='Pain was reported. Reduce load, review technique, or substitute exercise.'}
 else if(below||lowRir){decision='Reduce weight';ar='قلل الوزن';reason='Minimum reps were missed or RIR was 0-1 too often.';pct=-.05}
 else if(allDone&&allTop&&avgRir>=1.5&&avgRir<=3&&goodTech){decision='Increase weight';ar='زِد الوزن';reason=`Completed all planned sets at top reps with average RIR ${avgRir.toFixed(1)} and good technique.`; pct=ex.primary?.includes('Leg')||ex.pattern==='Hinge'?0.05:0.025; if(ex.id==='deadlift')pct=0.025}
 else if(allDone){decision='Improve reps first';ar='زِد العدات أولاً';reason='You completed the sets but not the top of the target range.'}
 const lastW=sets.length?n(sets[sets.length-1].weight):0; const suggested=roundWeight(lastW*(1+pct),ex.equipment); return {decision,ar,reason,suggested,avgRir};
}

function saveWorkoutLog(dayId){const d=activeProgram().days.find(x=>x.id===dayId);d.exercises.forEach(wx=>{const e=exById(wx.exerciseId), sc=setCount(wx.sets)||3, sets=[];for(let j=0;j<sc;j++){const reps=val(`log_${wx.id}_${j}_r`), weight=val(`log_${wx.id}_${j}_w`); if(reps||weight)sets.push({set:j+1,weight:n(weight),reps:n(reps),rir:n(val(`log_${wx.id}_${j}_rir`)),rpe:10-n(val(`log_${wx.id}_${j}_rir`)),technique:val(`log_${wx.id}_${j}_tech`),pain:val(`log_${wx.id}_${j}_pain`)})} if(sets.length){const log={id:uid('log'),date:today(),workoutDay:d.name,exerciseId:wx.exerciseId,exercise:e.en,order:wx.order,muscle:wx.muscle,targetSets:setCount(wx.sets),targetReps:wx.reps,sets,rest:wx.rest,warmup:document.getElementById('warmDone').checked,notes:val('note_'+wx.id),completed:true,volume:volumeFromSets(sets),bestE1rm:Math.max(...sets.map(s=>e1rm(s.weight,s.reps)))};log.progression=progressionFor(log);state.workoutLogs.push(log);state.progressionHistory.push({date:log.date,exerciseId:log.exerciseId,...log.progression})}});closeModal();render()}
function fmtTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function timerTick(){if(timerLeft>0){timerLeft--;document.getElementById('timerView')&&(document.getElementById('timerView').textContent=fmtTime(timerLeft))}else timerPause()}function timerStart(s){timerLeft=timerLeft||s;timerPause();timer=setInterval(timerTick,1000);render()}function timerPause(){clearInterval(timer);timer=null}function timerReset(){timerPause();timerLeft=0;render()}function timerSkip(){timerReset()}

function saveStartingWeight(){const ex=exById(val('swEx')), range=parseRange(val('swRange')), tests=[1,2,3].map(i=>({weight:n(val('swW'+i)),reps:n(val('swR'+i)),rir:n(val('swRi'+i)),technique:val('swT'+i)})).filter(t=>t.weight||t.reps);let label='مناسب Suitable', rec=tests.at(-1)?.weight||0, good=tests.filter(t=>t.technique==='Good');const best=good.find(t=>t.reps>=range.min&&t.reps<=Math.ceil((range.min+range.max)/2)&&t.rir>=1.5&&t.rir<=3); if(best){rec=best.weight;label='ابدأ بهذا الوزن Start with this weight'} else if(tests.some(t=>t.technique==='Bad'))label='تكنيك غير جيد Technique issue'; else if(tests.at(-1)?.reps>=range.max&&tests.at(-1)?.rir>=3)label='خفيف جداً Too light'; else if(tests.at(-1)?.reps<range.min||tests.at(-1)?.rir<=1)label='ثقيل جداً Too heavy';state.startingWeightTests.push({id:uid('sw'),date:today(),exerciseId:ex.id,exercise:ex.en,device:val('swDevice'),range:val('swRange'),rirTarget:val('swRir'),tests,recommended:rec,label,notes:val('swNotes')});render()}

function recoveryAlerts(){const recent=state.recoveryLogs.slice(-5), a=[]; if(recent.filter(r=>r.jointPain!=='No').length>=2)a.push('Joint pain repeated. Reduce load, review technique, or substitute exercise.'); if(recent.filter(r=>r.sleepQuality==='Bad'||r.sleepHours<6).length>=2)a.push('Bad sleep for several days. Add recovery and avoid training to failure.'); if(recent.filter(r=>r.fatigue==='High').length>=2)a.push('High fatigue. Consider deload or reduced sets.'); if(recent.some(r=>r.soreness>72))a.push('Soreness more than 72 hours. Reduce volume and improve recovery.'); if(weekNum()>=5)a.push('Week 5-6 deload check: reduce weights 10-20% or cut sets by half if fatigue is high.'); return a}
function analyticsWarnings(){const c=calcProfile(),nut=todayNutrition(), a=[]; if(nut.protein&&nut.protein<c.protein*.8)a.push('Protein below target. لا تخلي البروتين قليل.'); if(state.workoutLogs.length&&trainingConsistency().startsWith('0'))a.push('Workout consistency poor this week.'); state.workoutLogs.slice(-8).forEach(l=>{if(l.progression?.decision.includes('Reduce'))a.push(`${l.exercise}: ${l.progression.reason}`); if(l.sets.some(s=>s.technique==='Bad'))a.push(`${l.exercise}: repeated bad technique blocks load increase.`)}); state.exerciseLibrary.filter(e=>!e.link).slice(0,3).forEach(e=>a.push(`${e.en}: Exercise has no tutorial link.`)); return [...new Set(a)].slice(0,12)}
function exerciseReport(){return state.exerciseLibrary.map(e=>{const logs=state.workoutLogs.filter(l=>l.exerciseId===e.id), sw=state.startingWeightTests.find(s=>s.exerciseId===e.id), last=logs.at(-1), bestW=Math.max(0,...logs.flatMap(l=>l.sets.map(s=>n(s.weight)))), bestR=Math.max(0,...logs.flatMap(l=>l.sets.map(s=>n(s.reps)))), best1=Math.max(0,...logs.map(l=>l.bestE1rm||0)), start=n(sw?.recommended)||0, cur=last?last.sets.at(-1).weight:0, prog=start&&cur?((cur-start)/start*100).toFixed(1)+'%':'-';return {name:`${e.en} / ${e.ar}`,image:e.image,link:e.link,starting:start,current:cur,bestWeight:bestW,bestReps:bestR,bestE1rm:best1.toFixed(1),sessions:logs.length,progress:prog,lastDecision:last?.progression?.decision||'-',next:last?.progression?.suggested||'-',notes:e.userNotes}})}
function reportTable(){const rows=exerciseReport();return `<div class="tableWrap"><table><tr><th>Exercise</th><th>Starting</th><th>Current</th><th>Best</th><th>Best reps</th><th>Best e1RM</th><th>Sessions</th><th>Progress</th><th>Decision</th><th>Next</th></tr>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.starting}</td><td>${r.current}</td><td>${r.bestWeight}</td><td>${r.bestReps}</td><td>${r.bestE1rm}</td><td>${r.sessions}</td><td>${r.progress}</td><td>${r.lastDecision}</td><td>${r.next}</td></tr>`).join('')}</table></div>`}
function eduText(){return `<p>Hypertrophy مبادئ التضخيم: multiple-set resistance training, adequate volume, controlled technique, and progressive overload.</p><p>Progressive overload التدرج: زِد الوزن فقط عند اكتمال التكرارات بجودة جيدة وRIR قريب من 2.</p><p>Training intensity الشدة: استخدم RIR/RPE لتجنب الفشل المستمر. هدفك المعتدل RIR = 2.</p><p>Recovery الاستشفاء: النوم، تقليل الألم، ومراقبة الهبوط بالأداء أهم من إضافة تمارين عشوائية.</p><p>Cardio الكارديو: مشي سريع أو دراجة خفيفة إلى متوسطة يدعم الصحة وتقليل الدهون بدون إجهاد زائد.</p><p>Nutrition التغذية: توازن الطاقة، بروتين 1.6-2.0 g/kg، كارب لدعم التمرين، دهون كافية 0.7-1.0 g/kg.</p><p class="alert">This application is for fitness tracking and education only. For medical conditions, injuries, or chronic disease, consult a qualified healthcare professional.</p>`}

function exportJSON(){download('fitness-backup.json',JSON.stringify(state,null,2),'application/json')}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{state=JSON.parse(t);save();render()})}
function exportPrograms(){download('program-templates.json',JSON.stringify(state.programs,null,2),'application/json')}
function importPrograms(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{state.programs=state.programs.concat(JSON.parse(t));render()})}
function exportCSV(key){const rows=state[key]||[];if(!rows.length)return alert('No data');const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(typeof r[c]==='object'?JSON.stringify(r[c]):r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');download(key+'.csv',csv,'text/csv')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Reset all local data?')){localStorage.removeItem(LS_KEY);load();render()}}

function drawCharts(){drawLine('weightChart',state.bodyMeasurements.map(m=>[m.date,n(m.weight)]).filter(x=>x[1]),'Weight');drawLine('waistChart',state.bodyMeasurements.map(m=>[m.date,n(m.waist)]).filter(x=>x[1]),'Waist');drawLine('volumeChart',state.workoutLogs.map(l=>[l.date,n(l.volume)]),'Volume');drawBars('muscleChart',muscleVolumes())}
function drawLine(id,data,label){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=180*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.strokeRect(0,0,w,h);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');ctx.font=12*devicePixelRatio+'px Tahoma';ctx.fillText(label,12,20);if(data.length<2){ctx.fillText('No chart data yet',12,50);return}const vals=data.map(x=>x[1]),mn=Math.min(...vals),mx=Math.max(...vals),pad=28*devicePixelRatio;ctx.beginPath();data.forEach((d,i)=>{const x=pad+i*(w-pad*2)/(data.length-1),y=h-pad-((d[1]-mn)/(mx-mn||1))*(h-pad*2);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--brand');ctx.lineWidth=3*devicePixelRatio;ctx.stroke()}
function drawBars(id,data){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=180*devicePixelRatio;ctx.clearRect(0,0,w,h);const entries=Object.entries(data).slice(0,8),mx=Math.max(1,...entries.map(e=>e[1]));ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');ctx.font=11*devicePixelRatio+'px Tahoma';entries.forEach((e,i)=>{const y=24+i*18*devicePixelRatio,bw=(w-150*devicePixelRatio)*(e[1]/mx);ctx.fillText(e[0],8,y);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--brand2');ctx.fillRect(120*devicePixelRatio,y-10*devicePixelRatio,bw,10*devicePixelRatio);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted')})}
function muscleVolumes(){const out={};state.workoutLogs.filter(l=>inThisWeek(l.date)).forEach(l=>(l.muscle||'Other').split(',').forEach(m=>{m=m.trim();out[m]=(out[m]||0)+n(l.volume)}));return out}
load();render();
</script>
